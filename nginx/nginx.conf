server {
    listen 80 default_server;
    server_name padsign.trustlynx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name padsign.trustlynx.com;

    ssl_certificate     /etc/nginx/certs/padsign.trustlynx.com.crt;
    ssl_certificate_key /etc/nginx/certs/padsign.trustlynx.com.key;

    location /archive/api/ {
        proxy_pass http://dmss-archive-services:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /container/api/ {
        proxy_pass http://dmss-container-and-signature-services:8092/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ps-server:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ps-server answers slow upstreams itself, so nginx must wait longer
        # than ps-server's worst case. With ps-server 3.32's defaults
        # (psapp server/app.js):
        #   POST /api/stamp: up to 3 attempts at the e-seal service, 30 s
        #     timeout each (STAMP_STRATEGIES: external `timeout: 30000`,
        #     local STAMP_LOCAL.timeoutMs, default 30000; withRetries(.., 3,
        #     500)), + 0.5 s + 1 s back-off = 91.5 s, plus the archive
        #     download before and upload after, which set no timeout.
        #   POST /api/registerPDF: queue wait < 30 s (REGISTER_PDF_QUEUE_WAIT_MS)
        #     + 3 x 15 s archive upload (REGISTER_PDF_UPSTREAM_TIMEOUT_MS,
        #     _RETRIES) + 1.8 s back-off + the virtual-printer CustomerData
        #     lookup, 2 x 10 s + 0.5 s = 97.3 s.
        # The default 60 s is below both: on the demo host a slow e-seal
        # service (first call after a weekend) gave the browser nginx's 504
        # page during stamp attempt 2, instead of ps-server's own answer.
        # 180 s covers 97.3 s with 80 s to spare for the untimed archive
        # calls. It counts between two reads from ps-server, which sends
        # each answer in one go. If config.js raises STAMP_LOCAL.timeoutMs or
        # the REGISTER_PDF_* values, raise this to 3 x the timeout + margin.
        # proxy_send_timeout (60 s, between two writes of the request to
        # ps-server) stays: ps-server reads request bodies as they arrive.
        proxy_read_timeout 180s;
    }

    # Proxy /auth to Keycloak container
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Additional headers for Keycloak
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        # REMOVED CORS HEADERS - let Keycloak handle CORS
    }

    # Proxy client SPA to ps-client container by service name
    location ^~ /portal/ {
        proxy_pass http://ps-client:80/portal/;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (debug routes removed)

    # Redirect root to the SPA
    location / {
        return 301 https://$host/portal/;
    }
}
