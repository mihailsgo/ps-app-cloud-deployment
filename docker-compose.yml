services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=padsign.trustlynx.com
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
    command: start-dev
    # Loopback-only: reached externally via nginx (/auth/), by service name, on the
    # Docker network. Bound to the host at 127.0.0.1 only for keycloak-bootstrap.ps1
    # (Windows dev convenience, see documentation/14-02) and local `curl localhost:8080`
    # diagnostics. The Linux bootstrap path never uses the host port (docker compose exec).
    # See psapp-saas#13.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # No curl/wget in this image; KC_HEALTH_ENABLED puts health on the
      # separate management port 9000, and KC_HTTP_RELATIVE_PATH still
      # prefixes it (empirically confirmed: /health/ready is a 404 on 9000,
      # /auth/health/ready is 200) - so a raw bash /dev/tcp request it is.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
  dmss-archive-services:
    container_name: dmss-archive-services
    restart: always
    # Loopback-only: nginx reaches this by service name on the Docker network
    # (see nginx/nginx.conf `/archive/api/`). Bound to the host at 127.0.0.1 only for
    # the direct operator diagnostics in documentation/04-04 and 04-07 (curl
    # localhost:86/... run on the host, or via SSH tunnel). See psapp-saas#13.
    ports:
      - '127.0.0.1:86:8090'
    volumes:
      - './dmss-archive-services:/confs'
    environment:
      - SPRING_CONFIG_LOCATION=/confs/
    image: 'trustlynx/dmss-archive-services:24.2.0.8'
    healthcheck:
      # This service's own request-auth filter returns 403 for
      # /actuator/health (confirmed: consistent 403, not a transient
      # starting-up state) rather than leaving it open like its sibling
      # services below - a crashed/unreachable JVM gives connection-refused,
      # not a clean 403, so 403 still proves the app is up and routing.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8090/actuator/health | grep -qE '^(200|403)$'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      dmss-archive-services-fallback:
        condition: service_healthy
  dmss-container-and-signature-services:
    container_name: dmss-container-and-signature-services
    restart: always
    # Loopback-only: nginx reaches this by service name on the Docker network
    # (see nginx/nginx.conf `/container/api/`). Bound to the host at 127.0.0.1 only for
    # the direct operator diagnostics in documentation/04-04 and 04-07 (curl
    # localhost:84/... run on the host, or via SSH tunnel). See psapp-saas#13.
    ports:
      - '127.0.0.1:84:8092'
    volumes:
      - './dmss-container-and-signature-services:/confs'
    environment:
      - SPRING_CONFIG_LOCATION=/confs/
    image: 'trustlynx/container-signature-service:24.3.0.49'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      dmss-archive-services:
        condition: service_healthy
      dmss-archive-services-fallback:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Optional local e-sealing backend. Only starts when the "local-eseal"
  # compose profile is active (set COMPOSE_PROFILES=local-eseal in .env or
  # pass --profile local-eseal). Existing deployments that don't opt in are
  # completely unaffected.
  #
  # When active, this container is reached over the docker bridge network at
  # `dmss-digital-stamping-service:8084` by dmss-container-and-signature-services.
  # No host port mapping by design — avoids collision with any USB-token
  # signing service that customers may already be running on host:8084.
  # ─────────────────────────────────────────────────────────────────────────
  dmss-digital-stamping-service:
    container_name: dmss-digital-stamping-service
    profiles: ["local-eseal"]
    restart: always
    image: 'trustlynx/digital-stamping-service:24.0.3.0'
    environment:
      # ADDITIONAL_LOCATION (not LOCATION) so the in-jar baked YAML still loads;
      # ours layers on top and overrides only what we need to change.
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/conf/
    volumes:
      - './dmss-digital-stamping-service:/conf:ro'
      - './dmss-digital-stamping-service/seal:/seal:ro'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # No curl/wget in this image either - raw bash /dev/tcp, same pattern
      # as keycloak's, but this actuator needs no relative-path prefix.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084 && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  dmss-archive-services-fallback:
    container_name: dmss-archive-services-fallback
    restart: always
    # No host port mapping: only called internally, by service name, by
    # dmss-archive-services and dmss-container-and-signature-services. Nothing
    # in this repo (config, scripts, docs) reaches it via the host. See psapp-saas#13.
    volumes:
      - './dmss-archive-services-fallback:/dmss-archive-services-fallback'
      - './docs:/docs'
    environment:
      - SPRING_CONFIG_LOCATION=/dmss-archive-services-fallback/application.yml
    image: 'trustlynx/dmss-archive-services-fallback:24.0.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8095/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  ps-server:
    image: 'mihailsgordijenko/ps-server:3.28'
    container_name: ps-server
    # No host port mapping: nginx reaches this by service name on the Docker
    # network (see nginx/nginx.conf `/api/`). Nothing else in this repo needs
    # a host-level path to it. See psapp-saas#13.
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
      dmss-archive-services:
        condition: service_healthy
      dmss-container-and-signature-services:
        condition: service_healthy
    environment:
      - NO_PROXY=keycloak,ps-server,nginx,localhost,127.0.0.1
      - no_proxy=keycloak,ps-server,nginx,localhost,127.0.0.1
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
    volumes:
      - ./config/config.js:/usr/src/app/config.js
      - ./signed-output:/signed-output
    healthcheck:
      # /health is real but Keycloak-Bearer-protected by design (see
      # psapp/server/app.js) - a bare TCP check can't tell "up" from "up but
      # Express never finished registering routes". 200 (if ever made
      # public) or 401 (documented, expected) both prove the HTTP layer
      # itself is alive and routing correctly; anything else (5xx, refused)
      # is not. Node is guaranteed present in this image, curl/wget are not.
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:3001/health',res=>process.exit((res.statusCode===200||res.statusCode===401)?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ps-client:
        condition: service_healthy
      ps-server:
        condition: service_healthy
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
     - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      default:
        aliases:
          - padsign.trustlynx.com
    healthcheck:
      # -k: this probes nginx's own TLS listener from inside its own
      # container, not a client's trust store - the on-disk cert's validity
      # is verify-served-cert.sh's job, not a liveness check's.
      test: ["CMD-SHELL", "curl -skf -o /dev/null -w '%{http_code}' https://localhost:443/ | grep -q '301'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ps-client:
    image: mihailsgordijenko/ps-client:8.39
    container_name: ps-client
    restart: unless-stopped
    # No host port mapping; accessed via nginx by service name
    volumes:
      # Override runtime configuration file inside the client image
      - ./config/constants.json:/usr/share/nginx/html/portal/constants.json:ro
      # Runtime Keycloak override (prevents fallback to bundled default host)
      - ./config/keycloak.js:/usr/share/nginx/html/portal/keycloak.js:ro
      # Override logo used by the SPA
      - ./config/TLlogo.png:/usr/share/nginx/html/portal/logo.png:ro
    networks:
      - default
    healthcheck:
      # Root "/" is a 404 in this image (confirmed) - the SPA is served at
      # /portal/, which is what nginx actually proxies to.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:80/portal/ | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────
  # Optional browser-based deployment wizard. Only starts when the "wizard"
  # compose profile is active (`docker compose --profile wizard up -d wizard`).
  # Wraps installation-scripts/bootstrap.sh, upgrade.sh, validate-config.sh,
  # and validate-certs.sh — never reimplements their logic. Fully optional:
  # ignoring it and running the scripts by hand works exactly as before.
  #
  # Requires this compose command to be run FROM the project root — the
  # bind mount and working_dir below use ${PWD} on both sides so that the
  # `docker compose` commands this container spawns (via the mounted socket,
  # talking to the HOST daemon) resolve their own relative bind mounts
  # against a path the host actually has, instead of some path that only
  # exists inside this container's filesystem. See documentation/36-*.
  #
  # First-ever privileged container in this stack: /var/run/docker.sock
  # grants root-equivalent host access. The real security boundary is who
  # can reach its HTTPS port and who holds the token it prints to
  # `docker logs` on every start — see documentation/36-05.
  # ─────────────────────────────────────────────────────────────────────────
  wizard:
    image: mihailsgordijenko/padsign-wizard:0.1.1
    container_name: padsign-wizard
    profiles: ["wizard"]
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - HOST_PROJECT_DIR=${PWD}
      - WIZARD_PORT=8443
      # Extra names/IPs to put in the wizard's own self-signed certificate.
      # The wizard always covers localhost, 127.0.0.1 and its own container
      # hostname/IP, but it CANNOT discover the host address you actually
      # type into the browser. Without listing it here you get a browser
      # name-mismatch error on top of the expected self-signed warning —
      # bypassable on desktop, sometimes not on mobile. Comma-separated,
      # names or IPv4:
      # - WIZARD_TLS_SANS=10.0.0.42,padsign-host.internal
    volumes:
      - "${PWD}:${PWD}"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

networks:
  default:
    driver: bridge 

volumes:
  keycloak_data: 
